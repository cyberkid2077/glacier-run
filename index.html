// Tiles: . ice, # rock, _ floor, x cracked ice, o hole, E exit, > < ^ v arrows. Boulders/start separate.
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const ARW={'^':'U','v':'D','<':'L','>':'R'};
function step(lv,st,d){ // st:{p:[x,y],b:[[x,y]..],k:Set of broken idx}
  const W=lv.w,H=lv.h,g=lv.g;let [x,y]=st.p;let b=st.b.map(a=>a.slice());let k=new Set(st.k);
  const tile=(x,y)=>{const i=y*W+x;return k.has(i)?'o':g[i]};

  const path=[[x,y]];let push=null,seen=new Set(),dir=d,moved=false,used={};
  while(true){
    const key=x+','+y+dir;if(seen.has(key))return null;seen.add(key);
    const [dx,dy]=DIRS[dir];const nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H)break;const t=tile(nx,ny);
    if(t=='#'||t=='o')break;
    const bi=bAt(nx,ny);
    if(bi>=0){ // push boulder
      let bx=nx,by=ny;const bp=[[bx,by]];
      while(true){const cx=bx+dx,cy=by+dy;if(cx<0||cy<0||cx>=W||cy>=H)break;const ct=tile(cx,cy);
        if(ct=='#'||ct=='E'||bAt(cx,cy)>=0)break;
        if(ct=='o'){bx=cx;by=cy;bp.push([bx,by]);k.delete(cy*W+cx);bx=-1;break;} // fills hole
        bx=cx;by=cy;bp.push([bx,by]);if(ct=='_')break;}
      if(bp.length>1){used.B=1;push={i:bi,path:bp};if(bx<0){b.splice(bi,1);push.fill=1}else b[bi]=[bx,by];}
      break;}
    const cur=tile(x,y);if(cur=='x'){k.add(y*W+x);used.x=1}
    x=nx;y=ny;moved=true;path.push([x,y]);
    if(t=='E'||t=='_'){if(t=='_')used._=1;break;}
    if(ARW[t]){dir=ARW[t];used.a=1;}
  }
  if(!moved&&!push)return null;
  return {s:{p:[x,y],b,k},path,push,win:tile(x,y)=='E',used};
}
function skey(s){return s.p+'|'+s.b.map(a=>a.join(',')).sort().join(';')+'|'+[...s.k].sort((a,b)=>a-b).join(',')}
function initState(lv){return {p:lv.s.slice(),b:(lv.b||[]).map(a=>a.slice()),k:new Set()}}
function solve(lv,cap=150000){
  const s0=initState(lv);const q=[s0],prev=new Map([[skey(s0),null]]);let dead=0,branch=0;
  for(let qi=0;qi<q.length;qi++){const s=q[qi];const ks=skey(s);let n=0;
    for(const d of 'UDLR'){const r=step(lv,s,d);if(!r)continue;n++;const kk=skey(r.s);

        return {par:sol.length,sol:sol.join(''),states:prev.size,dead,branch:branch/(qi+1)};}
      if(!prev.has(kk)){prev.set(kk,[ks,d]);q.push(r.s);}}
    if(!n)dead++;branch+=n;if(prev.size>cap)return null;}
  return null;}

let sx=null,sy=null;const gm=$('game');
gm.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;e.preventDefault()},{passive:false});
gm.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
gm.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
document.addEventListener('gesturestart',e=>e.preventDefault());
(function loop(){if(!anim&&L&&!$('game').classList.contains('hide'))draw();setTimeout(()=>requestAnimationFrame(loop),80)})();
menu();
</script></body></html>
